name: Deploy ankaanka.org to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  repository_dispatch:
    types: [inferring-intelligence-updated]
  schedule:
    # 每天北京时间 10:00 与 22:00 检查一次 Inferring-Intelligence，有新提交才构建部署
    - cron: '0 2,14 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.diff.outputs.should_build }}
    steps:
      - name: Check whether Inferring-Intelligence has new commits
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }} — build required."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REMOTE_SHA=$(git ls-remote https://github.com/anka-afk/Inferring-Intelligence.git refs/heads/main | awk '{print $1}')
          DEPLOYED_SHA=$(curl -fsSL https://ankaanka.org/sync-meta.json 2>/dev/null | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1 || true)

          echo "Remote Inferring-Intelligence SHA : ${REMOTE_SHA:-<empty>}"
          echo "Deployed ankaanka.org SHA         : ${DEPLOYED_SHA:-<empty>}"

          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$DEPLOYED_SHA" ]; then
            echo "No new commits in Inferring-Intelligence. Skipping build & deploy."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected (or sync-meta missing). Proceeding with build & deploy."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Inferring-Intelligence & Build Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
